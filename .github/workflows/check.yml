# [ M E G A D E V ]
#
# Runs the verification gate (`make check`, see docs/manual.md) on every push
# to develop or master and on every pull request.
#
# The gate needs the Megadev toolchain (tools/build-toolchain.sh). It is built
# here and cached, keyed on the script and its patches, so it is rebuilt only
# when they change: a cold build takes about 10 to 15 minutes, a cache hit
# seconds (the stripped install is about 90 MB). Nothing is published. The key
# names the container image too, since the compiler links to the image's GMP,
# MPFR and MPC.
#
# `make docs` is not run: its zero-warning standard holds for Doxygen 1.16, and
# Debian 13 has 1.9.

name: check

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

env:
  TOOLCHAIN: /opt/megadev-toolchain

jobs:
  check:
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            make gcc g++ libc6-dev libgmp-dev libmpfr-dev libmpc-dev \
            curl ca-certificates git xz-utils zstd genisoimage

      - uses: actions/checkout@v4

      # Restored and saved as separate steps, so a fresh build is kept even
      # when the gate then fails.
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TOOLCHAIN }}
          key: megadev-toolchain-debian13-${{ hashFiles('tools/build-toolchain.sh', 'tools/patches/**') }}

      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/build-toolchain.sh "$TOOLCHAIN"

      - name: Save the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TOOLCHAIN }}
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: make check
        run: |
          export PATH="$TOOLCHAIN/bin:$PATH"
          m68k-elf-gcc --version | head -n 1
          make check
